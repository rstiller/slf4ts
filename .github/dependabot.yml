version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/**"
      - "/examples/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: chai
        versions: [">=5"]
      - dependency-name: typescript
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/test-env/**"
    schedule:
      interval: weekly
